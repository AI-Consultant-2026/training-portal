<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="regTitle">
  <title id="regTitle">Who regulates HSE in Nigerian oil and gas: NUPRC upstream, NMDPRA midstream and downstream, NOSDRA for oil spills across the whole chain</title>
  <rect width="780" height="300" fill="#F9FAFB"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <!-- Upstream -->
    <rect x="22" y="26" width="324" height="148" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <path d="M60,74 L72,44 L84,74 M64,64 H80 M58,74 H86" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="58" font-size="15" font-weight="700" fill="#111827">NUPRC</text>
    <text x="104" y="76" font-size="11" fill="#6B7280">Upstream regulator</text>
    <text x="44" y="110" font-size="11.5" fill="#111827">Exploration, drilling and production:</text>
    <text x="44" y="128" font-size="11.5" fill="#111827">rigs, wells, flow stations, platforms</text>
    <text x="44" y="154" font-size="10.5" fill="#6B7280">Producing hydrocarbons from the ground</text>
    <!-- Wellhead divider -->
    <line x1="390" y1="20" x2="390" y2="180" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"/>
    <rect x="352" y="88" width="76" height="24" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.2"/>
    <text x="390" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">WELLHEAD</text>
    <!-- Mid/downstream -->
    <rect x="434" y="26" width="324" height="148" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.4"/>
    <path d="M466,70 H502 M466,58 H502 M472,58 V70 M496,58 V70 M484,44 V58" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round"/>
    <text x="518" y="58" font-size="15" font-weight="700" fill="#111827">NMDPRA</text>
    <text x="518" y="76" font-size="11" fill="#6B7280">Midstream and downstream regulator</text>
    <text x="454" y="110" font-size="11.5" fill="#111827">Moving, processing and storing:</text>
    <text x="454" y="128" font-size="11.5" fill="#111827">pipelines, refineries, gas plants, depots</text>
    <text x="454" y="154" font-size="10.5" fill="#6B7280">Everything after the wellhead</text>
    <!-- NOSDRA bar -->
    <rect x="22" y="192" width="736" height="44" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.4"/>
    <path d="M52,204 C46,214 44,218 44,222 A8,8 0 0 0 60,222 C60,218 58,214 52,204 Z" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="74" y="219" font-size="13" font-weight="700" fill="#111827">NOSDRA</text>
    <text x="146" y="219" font-size="11.5" fill="#6B7280">Oil spill detection and response, across the whole chain (established 2006)</text>
    <!-- Footnote -->
    <text x="22" y="262" font-size="10.5" fill="#6B7280">NUPRC and NMDPRA were created by the Petroleum Industry Act 2021.</text>
    <text x="22" y="280" font-size="10.5" fill="#6B7280">NESREA enforces environmental standards in other sectors; its 2007 Act excludes oil and gas.</text>
  </g>
</svg>
